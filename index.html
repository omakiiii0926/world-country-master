op{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px}.status{background:rgba(0,0,0,.28);border-radius:11px;padding:8px 11px;font-weight:bold}.progress{height:10px;background:rgba(255,255,255,.12);border-radius:20px;overflow:hidden;margin-bottom:14px}.progressBar{height:100%;background:linear-gradient(90deg,#00b8ed,#65e8ff);width:0}.question{text-align:center;font-size:clamp(22px,4vw,32px);font-weight:900}.questionSub{text-align:center;color:#a8d9e8;margin-bottom:13px}.flag{font-size:95px;text-align:center;margin:8px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.choice{min-height:58px;border:0;border-radius:14px;padding:12px;color:#fff;background:linear-gradient(145deg,#075d86,#063d5c);font-weight:900;box-shadow:0 5px 0 #032c43}.choice.correct{background:#159449}.choice.wrong{background:#d33e3e}.choice.disabled{pointer-events:none}.feedback{text-align:center;min-height:36px;margin-top:12px;font-size:18px;font-weight:900}.next{text-align:center;margin-top:8px}.borderQuestion{display:none;text-align:center;margin-bottom:14px;padding:16px;border-radius:17px;background:linear-gradient(145deg,#503d00,#2c2300);border:3px solid #ffd83d}.borderQuestion small{color:#ffe77a;letter-spacing:2px}.borderQuestion b{display:block;font-size:clamp(22px,5vw,32px);margin-top:5px}.borderInfo{display:none;text-align:center;color:#dff8ff;margin-bottom:10px}.legend{display:none;text-align:center;background:rgba(0,0,0,.3);padding:10px;border-radius:12px;margin-bottom:10px;line-height:2}.chip{display:inline-block;width:15px;height:15px;vertical-align:-2px;border-radius:2px;margin-right:4px}.yellow{background:#FFD600;border:2px solid #000}.white{background:#fff;border:2px solid #000}.blue{background:#91dff1;border:1px solid #5caabb}#map{height:430px;border-radius:16px;overflow:hidden;background:#91dff1;border:2px solid rgba(255,255,255,.25);margin-bottom:10px}.answerBox{display:none;padding:16px;margin-top:14px;border-radius:16px;text-al <body>
<section id="home" class="screen active"><div class="container home"><div class="logo">🌍 WORLD COUNTRY MASTER</div><div class="subtitle">195か国を極める世界地理ゲーム</div><div class="card"><div class="menu"><button class="btn" onclick="openMode('capital')">🏛️ 首都モード</button><button class="btn" onclick="openMode('flag')">🏳️ 国旗モード</button><button class="btn" onclick="openMode('border')">🗺️ 国境モード</button><button class="btn" onclick="openMode('daily')">📅 デイリー</button><button class="btn secondary" onclick="showScreen('book')">📚 国図鑑</button><button class="btn secondary" onclick="showScreen('titles')">🏆 称号</button><button class="btn secondary" onclick="showScreen('scores')">📊 スコア</button><button class="btn secondary" onclick="showScreen('settings')">⚙️ 設定</button></div></div></div></section>
<section id="modeSettings" class="screen"><div class="container"><div class="card"><button class="back" onclick="showScreen('home')">← ホーム</button><h1 id="modeTitle">ゲーム設定</h1><div class="setting"><div class="settingTitle">🎚️ 難易度</div><div class="optionRow"><button class="option selected" data-type="difficulty" data-value="easy" onclick="choose(this)">🟢 初級</button><button class="option" data-type="difficulty" data-value="normal" onclick="choose(this)">🟡 中級</button><button class="option" data-type="difficulty" data-value="hard" onclick="choose(this)">🔴 上級</button></div><p id="difficultyInfo"></p></div><div class="setting"><div class="settingTitle">🔢 問題数</div><div class="optionRow"><button class="option selected" data-type="count" data-value="10" onclick="choose(this)">10問</button><button class="option" data-type="count" data-value="20" onclick="choose(this)">20問</button><button class="option" data-type="count" data-value="50" onclick="choose(this)">50問</button></div></div><div class="setting"><div class="settingTitle">🌎 地域</div><div class="optionRow"><button class="option selected" data-type="region" data-value="all" onclick="choose(this)">全世界</button><button class="option" data-type="region" data-value="アジア" onclick="choose(this)">アジア</button><button class="option" data-type="region" data-value="ヨーロッパ" onclick="choose(this)">ヨーロッパ</button><button class="option" data-type="region" data-value="アフリカ" onclick="choose(this)">アフリカ</button><button class="option" data-type="region" data-value="北アメリカ" onclick="choose(this)">北アメリカ</button><button class="option" data-type="region" data-value="南アメリカ" onclick="choose(this)">南アメリカ</button><button class="option" data-type="region" data-value="オセアニア" onclick="choose(this)">オセアニア</button></div></div><div class="setting"><div class="settingTitle">🔥 特殊ルール</div><div class="optionRow"><button class="option selected" data-type="rule" data-value="normal" onclick="choose(this)">通常</button><button class="option" data-type="rule" data-value="time" onclick="choose(this)">⏱️ タイムアタック</button><button class="option" data-type="rule" data-value="nomiss" onclick="choose(this)">💎 ノーミス</button></div></div><button class="btn" style="width:100%" onclick="startGame()">🎮 ゲーム開始 ▶</button></div></div></section>
<section id="quiz" class="screen"><div class="container"><div class="quizTop"><button class="back" onclick="goHome()">⌂ ホーム</button><div class="status" id="counter"></div><div class="status" id="scoreDisplay"></div><div class="status" id="timer">⏱️ --</div></div><div class="progress"><div class="progressBar" id="progressBar"></div></div><div class="card"><div id="borderQuestion" class="borderQuestion"><small>🎯 QUESTION</small><b>黄色で表示された国はどこ？</b></div><div id="borderInfo" class="borderInfo">🟨 黄色の国を8択から答えよう</div><div id="question" class="question"></div><div id="questionSub" class="questionSub"></div><div id="flagArea"></div><div id="mapArea" style="display:none"><div id="legend" class="legend"><span class="chip yellow"></span>問題の国　<span class="chip white"></span>その他　<span class="chip blue"></span>海</div><div id="map"></div><button class="btn" style="width:100%;background:linear-gradient(145deg,#f0b900,#9b6800)" onclick="moveToCountry()">📍 問題の国へ移動</button></div><div id="choices" class="choices"></div><div id="answerBox" class="answerBox"></div><div id="feedback" class="feedback"></div><div class="next"><button id="nextButton" class="btn" style="display:none" onclick="nextQuestion()">次の問題へ →</button></div></div></div></section>
<section id="result" class="screen"><div class="container"><div class="card"><h1 style="text-align:center">🎉 RESULT</h1><div id="finalScore" class="bigScore"></div><div id="finalDetail" style="text-align:center"></div><button class="btn" style="width:100%" onclick="showScreen('home')">🏠 ホームへ</button></div></div></section>
<section id="book" class="screen"><div class="container"><div class="card"><button class="back" onclick="showScreen('home')">← ホーム</button><h1>📚 国図鑑</h1><p id="bookProgress"></p><div id="countryGrid" class="grid"></div></div></div></section>
<section id="titles" class="screen"><div class="container"><div class="card"><button class="back" onclick="showScreen('home')">← ホーム</button><h1>🏆 称号</h1><div id="titleList"></div></div></div></section>
<section id="scores" class="screen"><div class="container"><div class="card"><button class="back" onclick="showScreen('home')">← ホーム</button><h1>📊 スコア</h1><div id="bestScore" class="bigScore"></div><div id="scoreHistory"></div></div></div></section>
<section id="settings" class="screen"><div class="container"><div class="card"><button class="back" onclick="showScreen('home')">← ホーム</button><h1>⚙️ 設定</h1><button class="btn danger" style="width:100%;margin:5px" onclick="resetBook()">📚 図鑑をリセット</button><button class="btn danger" style="width:100%;margin:5px" onclick="resetTitles()">🏆 称号をリセット</button><button class="btn danger" style="width:100%;margin:5px" onclick="resetScores()">📊 スコアをリセット</button><button class="btn danger" style="width:100%;margin:5px" onclick="resetAll()">🗑️ 全データをリセット</button></div></div></section>
<div id="modal" class="modal"><div class="modalContent"><button class="back" onclick="closeModal()">✕ 閉じる</button><div id="modalBody"></div></div></div>

const load=k=>{try{return JSON.parse(localStorage.getItem(k)||'[]')}catch{return[]}};let unlocked=load('wcm_unlocked'),titleUnlocks=load('wcm_titles'),scores=load('wcm_scores');const save=()=>{localStorage.setItem('wcm_unlocked',JSON.stringify(unlocked));localStorage.setItem('wcm_titles',JSON.stringify(titleUnlocks));localStorage.setItem('wcm_scores',JSON.stringify(scores))};
let mode='capital',config={difficulty:'easy',count:10,region:'all',rule:'normal'},questions=[],qIndex=0,current='',score=0,correctCount=0,answered=false,noMiss=true,timer=null,map=null,geoLayer=null,currentMapBounds=null;
function showScreen(id){if(id!=='quiz')clearMap();document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='book')renderBook();if(id==='titles')renderTitles();if(id==='scores')renderScores()}
function clearMap(){if(map){try{map.remove()}catch{}}map=null;geoLayer=null;currentMapBounds=null}
function openMode(m){mode=m;document.getElementById('modeTitle').textContent={capital:'🏛️ 首都モード',flag:'🏳️ 国旗モード',border:'🗺️ 国境モード',daily:'📅 デイリーチャレンジ'}[m];showScreen('modeSettings')}
function choose(b){const t=b.dataset.type;b.parentElement.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');if(t==='difficulty'){config.difficulty=b.dataset.value;document.getElementById('difficultyInfo').textContent=difficultyInfo[config.difficulty]}if(t==='count')config.count=+b.dataset.value;if(t==='region')config.region=b.dataset.value;if(t==='rule')config.rule=b.dataset.value}
function shuffle(a){a=a.slice();for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function getPool(){const set=config.difficulty==='easy'?easyNames:config.difficulty==='normal'?mediumNames:hardNames;let p=countries.filter(c=>set.has(c.name));if(config.region!=='all')p=p.filter(c=>c.region===config.region);return p}
function startGame(){clearInterval(timer);let p=getPool();if(!p.length){alert('この難易度・地域では出題できる国がありません。');return}const count=mode==='daily'?Math.min(10,p.length):Math.min(config.count,p.length);questions=shuffle(p).slice(0,count).map(c=>c.name);qIndex=0;score=0;correctCount=0;answered=false;noMiss=true;showScreen('quiz');updateScore();config.rule==='time'?startTimer():document.getElementById('timer').textContent='⏱️ --';showQuestion()}
function startTimer(){let sec=questions.length<=10?60:questions.length<=20?120:300;document.getElementById('timer').textContent='⏱️ '+sec;timer=setInterval(()=>{sec--;document.getElementById('timer').textContent='⏱️ '+sec;if(sec<=0){clearInterval(timer);finishGame()}},1000)}
function showQuestion(){if(qIndex>=questions.length){finishGame();return}clearMap();current=questions[qIndex];const c=countries.find(x=>x.name===current);answered=false;counter.textContent=`${qIndex+1} / ${questions.length}`;progressBar.style.width=`${qIndex/questions.length*100}%`;feedback.textContent='';nextButton.style.display='none';choices.innerHTML='';flagArea.innerHTML='';mapArea.style.display='none';borderQuestion.style.display='none';borderInfo.style.display='none';answerBox.style.display='none';if(mode==='capital'||mode==='daily'){question.textContent='🏛️ この国の首都を当てよう！';questionSub.textContent=`${c.flag} ${c.name}`}else if(mode==='flag'){question.textContent='🏳️ この国旗はどこの国？';questionSub.textContent='8つの選択肢から選ぼう！';flagArea.innerHTML=`<div class="flag">${c.flag}</div>`}else{question.textContent='';questionSub.textContent='';borderQuestion.style.display='block';borderInfo.style.display='block';mapArea.style.display='block';legend.style.display='block';setTimeout(initMap,80)}createChoices()}
function createChoices(){const c=countries.find(x=>x.name===current),correct=(mode==='capital'||mode==='daily')?c.capital:current,ans=[correct];for(const x of shuffle(countries.filter(x=>x.name!==current))){const v=(mode==='capital'||mode==='daily')?x.capital:x.name;if(!ans.includes(v))ans.push(v);if(ans.length===8)break}shuffle(ans).forEach(v=>{const b=document.createElement('button');b.className='choice';b.textContent=v;b.onclick=()=>answerQuestion(v,correct,b);choices.appendChild(b)})}
function answerQuestion(ans,correct,b){if(answered)return;answered=true;document.querySelectorAll('.choice').forEach(x=>{x.classList.add('disabled');if(x.textContent===correct)x.classList.add('correct')});if(ans===correct){score+=100;correctCount++;b.classList.add('correct');feedback.textContent='🎉 正解！ +100 pt';unlockCountry(current)}else{score=Math.max(0,score-25);noMiss=false;b.classList.add('wrong');feedback.textContent=config.rule==='nomiss'?'💥 ノーミス失敗！':'❌ 不正解！'}if(mode==='border')showBorderAnswer();updateScore();nextButton.style.display='inline-block'}
function showBorderAnswer(){answerBox.style.display='block';answerBox.innerHTML=`<small>🟨 ANSWER</small><div class="country">${current}</div><div>地図上の黄色い国が答えです</div>`;highlightTarget()}

function getISO2(f){const p=f.properties||{};return String(p['ISO3166-1-Alpha-2']||p.ISO_A2||p.iso_a2||p.ISO_A2_EH||p.WB_A2||'').toUpperCase()}
function initMap(){if(typeof L==='undefined'){map.innerHTML='地図を読み込めませんでした';return}clearMap();map=L.map('map',{zoomControl:true,attributionControl:false,worldCopyJump:true,minZoom:1}).setView([20,0],2);fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson').then(r=>{if(!r.ok)throw 0;return r.json()}).then(g=>{const target=countries.find(c=>c.name===current);geoLayer=L.geoJSON(g,{style:f=>{const yes=getISO2(f)===target.iso;return{color:'#000',weight:yes?5:1.2,fillColor:yes?'#FFD600':'#FFFFFF',fillOpacity:1,opacity:1}},interactive:false}).addTo(map);highlightTarget();setTimeout(()=>map&&map.invalidateSize(),100)}).catch(()=>{document.getElementById('map').innerHTML='<div style="height:100%;display:flex;align-items:center;justify-content:center;color:#123b4c">🌍 地図データを読み込めませんでした。</div>'})}
function highlightTarget(){if(!geoLayer)return;const target=countries.find(c=>c.name===current);currentMapBounds=null;geoLayer.eachLayer(l=>{if(!l.feature)return;const yes=getISO2(l.feature)===target.iso;l.setStyle({color:'#000',weight:yes?5:1.2,fillColor:yes?'#FFD600':'#FFF',fillOpacity:1,opacity:1});if(yes){if(l.bringToFront)l.bringToFront();try{const b=l.getBounds();currentMapBounds?currentMapBounds.extend(b):currentMapBounds=b}catch{}}})}
function moveToCountry(){if(!map||!geoLayer){borderInfo.textContent='⏳ 地図を読み込み中…';return}highlightTarget();if(currentMapBounds&&currentMapBounds.isValid())map.fitBounds(currentMapBounds,{padding:[45,45],maxZoom:6});borderInfo.textContent='📍 黄色で表示されている場所を確認しよう！'}
function unlockCountry(name){if(unlocked.includes(name))return;unlocked.push(name);save();const c=countries.find(x=>x.name===name);showModal(`<div style="font-size:70px">📚</div><h2>国図鑑アンロック！</h2><div style="font-size:55px">${c.flag}</div><h2>${c.name}</h2>`)}
function renderBook(){bookProgress.textContent=`アンロック：${unlocked.length} / ${countries.length} か国`;countryGrid.innerHTML='';countries.forEach(c=>{const d=document.createElement('div');if(unlocked.includes(c.name)){d.className='countryCard';d.innerHTML=`<div class="countryFlag">${c.flag}</div><b>${c.name}</b>`;d.onclick=()=>showModal(`<div style="font-size:75px">${c.flag}</div><h2>${c.name}</h2><p>🏛️ 首都：${c.capital}</p><p>🌎 地域：${c.region}</p><p>🔤 ISO：${c.iso}</p>`)}else{d.className='countryCard locked';d.innerHTML='<div class="countryFlag">?</div><b>？？？</b>'}countryGrid.appendChild(d)})}
const titleData=[['t1','🌱 はじめの一歩','1問正解',()=>totalCorrect()>=1],['t2','🔟 10問突破','10問正解',()=>totalCorrect()>=10],['t3','🎯 50問マスター','50問正解',()=>totalCorrect()>=50],['t4','💯 センチュリアン','100問正解',()=>totalCorrect()>=100],['t5','👑 パーフェクト','10問全問正解',()=>scores.some(s=>s.total===10&&s.correct===10)],['t6','⚡ スピードスター','タイムアタックをプレイ',()=>scores.some(s=>s.rule==='time')],['t7','💎 ノーミス','全問正解',()=>scores.some(s=>s.total>0&&s.correct===s.total)],['t8','🗺️ 国境探検家','国境モードをプレイ',()=>scores.some(s=>s.mode==='border')],['t9','🏳️ 国旗博士','国旗モードで10問正解',()=>modeCorrect('flag')>=10],['t10','🏛️ 首都博士','首都モードで10問正解',()=>modeCorrect('capital')>=10],['t11','📅 デイリー挑戦者','デイリーをプレイ',()=>scores.some(s=>s.mode==='daily')],['t12','🌎 世界探検家','10か国解放',()=>unlocked.length>=10],['t13','🧭 世界旅行者','50か国解放',()=>unlocked.length>=50],['t14','🌐 世界研究家','100か国解放',()=>unlocked.length>=100],['t15','🏆 WORLD MASTER','195か国解放',()=>unlocked.length>=195],['t16','🔥 200問突破','200問正解',()=>totalCorrect()>=200],['t17','💰 1000ポイント','1ゲーム1000pt',()=>scores.some(s=>s.score>=1000)],['t18','💎 ハイスコア王','合計5000pt',()=>scores.reduce((a,b)=>a+b.score,0)>=5000],['t19','🌍 世界制覇への道','150か国解放',()=>unlocked.length>=150],['t20','👑 TRUE WORLD MASTER','195か国＋500問正解',()=>unlocked.length>=195&&totalCorrect()>=500]];
